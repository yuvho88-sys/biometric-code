<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תצוגה מקדימה — שלושה סקינים</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Assistant,Arial,sans-serif;background:#14100e;color:#eee;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#1d1815;border-bottom:1px solid #332a24;flex-wrap:wrap}
  h1{font-size:15px;font-weight:600;letter-spacing:.04em;color:#c9bdb0;margin-inline-end:auto}
  .grp{display:flex;gap:8px;align-items:center}
  .lbl{font-size:12px;color:#8d8177;letter-spacing:.08em}
  button{font:inherit;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:6px;
    border:1px solid #4a3d34;background:#241d19;color:#d8ccc0;cursor:pointer;transition:.15s}
  button:hover{border-color:#7a6455}
  button.on{background:#6E2A35;border-color:#6E2A35;color:#F5EFE4}
  button.w.on{background:#3E7C6F;border-color:#3E7C6F}
  button.m.on{background:#8A6A2F;border-color:#8A6A2F;color:#F5EFE4}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:7px;vertical-align:-1px}
  #stage{flex:1;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:#0d0a09;padding:0}
  iframe{border:0;background:#fff;display:block;box-shadow:0 0 0 1px #332a24}
</style>
</head>
<body>
<header>
  <h1>רעות ביטון · תצוגה מקדימה</h1>
  <div class="grp">
    <span class="lbl">סקין</span>
    <button data-skin="skin-a" class="on"><i class="swatch" style="background:#6E2A35"></i>A · אטלס</button>
    <button data-skin="skin-b"><i class="swatch" style="background:#8A3B5C"></i>B · חדר מדידה</button>
    <button data-skin="skin-c"><i class="swatch" style="background:#D8B072"></i>C · לילה במעבדה</button>
  </div>
  <div class="grp">
    <span class="lbl">מקצב</span>
    <button data-mode="dark" class="m on">רצף כהה</button>
    <button data-mode="light" class="m">רגעים בהירים</button>
    <button data-mode="bright" class="m">רצף בהיר</button>
  </div>
  <div class="grp">
    <span class="lbl">רוחב</span>
    <button class="w on" data-w="full">מסך מלא</button>
    <button class="w" data-w="1440">1440</button>
    <button class="w" data-w="390">390 · נייד</button>
  </div>
  <div class="grp">
    <button id="again">▶ הרץ שוב את האנימציה</button>
  </div>
</header>
<div id="stage"><iframe id="fr" src="index.html"></iframe></div>

<script>
(function(){
  var fr = document.getElementById('fr'), stage = document.getElementById('stage');
  var skin = 'skin-a', width = 'full', mode = 'dark';

  // ── מקצב תאורה: אילו סקשנים בהירים בכל מצב ──
  // "רצף כהה" = הכל כהה · "רגעים בהירים" = תועלת, שקיפות, מכתב, טופס
  var LIGHT_IN_MODE = {
    dark:   [],
    light:  ['benes', 'obj', 'about', 'formsec'],
    bright: ['pain','benes','obj','about','trial','tests','wac','who2','faq','formsec']
  };
  var NATURALLY_LIGHT = ['pain', 'about', 'trial'];   // סקשנים שבברירת המחדל בהירים

  function applyMode(){
    var doc; try { doc = fr.contentDocument; } catch(e){ return; }
    if (!doc) return;
    var lights = LIGHT_IN_MODE[mode];
    doc.querySelectorAll('.bc section, .bc header, .bc footer').forEach(function(sec){
      sec.classList.remove('surface-light', 'surface-dark');
      var key = [...sec.classList].find(function(c){ return /^(pain|benes|obj|about|trial|tests|wac|who2|faq|formsec|decode|video)$/.test(c); });
      if (!key) return;
      var wantLight = lights.indexOf(key) !== -1;
      var isLight = NATURALLY_LIGHT.indexOf(key) !== -1;
      if (wantLight && !isLight) sec.classList.add('surface-light');
      if (!wantLight && isLight) sec.classList.add('surface-dark');
    });
  }

  function sizeIt(){
    if (width === 'full') { fr.style.width = '100%'; fr.style.height = stage.clientHeight + 'px'; }
    else { fr.style.width = width + 'px'; fr.style.height = stage.clientHeight + 'px'; }
  }
  function applySkin(){
    try { fr.contentDocument.documentElement.className = skin; } catch(e){}
  }
  fr.addEventListener('load', function(){ applySkin(); applyMode(); sizeIt(); });
  window.addEventListener('resize', sizeIt);

  document.querySelectorAll('[data-skin]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('[data-skin]').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); skin = b.dataset.skin; applySkin(); applyMode();
    });
  });
  document.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('[data-mode]').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); mode = b.dataset.mode; applyMode();
    });
  });
  document.querySelectorAll('[data-w]').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('[data-w]').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); width = b.dataset.w; sizeIt();
    });
  });
  document.getElementById('again').addEventListener('click', function(){
    fr.contentWindow.location.reload();
  });
  sizeIt();
})();
</script>
</body>
</html>
